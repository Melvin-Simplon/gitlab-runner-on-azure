# Manual pipeline only: Build > Pipelines > Run pipeline on main, then pick ACTION.
# Nothing runs on push or merge request.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

variables:
  ACTION:
    value: "plan"
    options: ["plan", "up", "stop", "start", "destroy"]
    description: "make target to run against Azure"
  TERRAFORM_VERSION: "1.15.8"

infra:
  image: mcr.microsoft.com/azure-cli:2.90.0
  # One run at a time against the cluster and the Terraform states.
  resource_group: azure-infra
  id_tokens:
    AZURE_ID_TOKEN:
      aud: api://AzureADTokenExchange
  variables:
    # Terraform authenticates through the GitLab OIDC token, no stored secret.
    ARM_USE_OIDC: "true"
    ARM_CLIENT_ID: $AZURE_CLIENT_ID
    ARM_TENANT_ID: $AZURE_TENANT_ID
    CONFIRM: "yes"
  before_script:
    - tdnf install -y make unzip >/dev/null
    - curl -fsSLo /tmp/tf.zip "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
    - unzip -q /tmp/tf.zip -d /usr/local/bin
    - az aks install-cli --install-location /usr/local/bin/kubectl --kubelogin-install-location /usr/local/bin/kubelogin >/dev/null
    - export ARM_OIDC_TOKEN="$AZURE_ID_TOKEN"
    # az CLI session used by kubelogin and the scripts.
    - az login --service-principal -u "$AZURE_CLIENT_ID" -t "$AZURE_TENANT_ID" --federated-token "$AZURE_ID_TOKEN" -o none
  script:
    - make "$ACTION"
  artifacts:
    when: always
    paths:
      - .logs/
    expire_in: 7 days
