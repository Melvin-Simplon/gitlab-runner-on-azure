# Pipeline used only to test the runner on AKS, in about 25 seconds.

# It runs only when someone starts it by hand, never on a push.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"

# The runner takes 2 jobs at a time, so both jobs start together.
stages:
  - stress

default:
  # The runner only takes jobs that carry one of its tags.
  tags: [linux]

# The jobs do not need the repository.
variables:
  GIT_STRATEGY: none

# Loads the CPU and 700 MB of memory, then sends a 20 MB artifact to GitLab.
stress-cpu-memory:
  stage: stress
  script:
    - echo "Runner $CI_RUNNER_DESCRIPTION, pod $(hostname), $(nproc) CPUs"
    - apk add --no-cache -q stress-ng
    - stress-ng --cpu 1 --vm 1 --vm-bytes 700M --timeout 10s --metrics-brief
    - dd if=/dev/urandom of=payload.bin bs=1M count=20
  artifacts:
    paths:
      - payload.bin
    expire_in: 1 day

# Writes on the node disk, then downloads 100 MB.
stress-disk-network:
  stage: stress
  script:
    - apk add --no-cache -q stress-ng
    - stress-ng --hdd 1 --hdd-bytes 256M --timeout 6s --metrics-brief
    - time sh -c 'wget -q -O - https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/x86_64/alpine-standard-3.22.6-x86_64.iso | head -c 104857600 > /dev/null'
