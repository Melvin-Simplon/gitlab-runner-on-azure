# Official chart from victoriametrics.github.io, values from this repository.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: victoria-logs
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://victoriametrics.github.io/helm-charts
      chart: victoria-logs-single
      targetRevision: 0.13.10
      helm:
        releaseName: victoria-logs
        valueFiles:
          - $values/k8s/victoria-logs/values.yaml
    - repoURL: https://gitlab.com/WhiteMuush/gitlab-runner-on-azure.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
