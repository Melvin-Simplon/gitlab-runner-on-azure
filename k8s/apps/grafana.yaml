# Chart from grafana-community (the grafana/helm-charts chart is being migrated there).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: grafana
      targetRevision: 13.2.7
      helm:
        releaseName: grafana
        valueFiles:
          - $values/k8s/grafana/values.yaml
    - repoURL: https://gitlab.com/WhiteMuush/gitlab-runner-on-azure.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
