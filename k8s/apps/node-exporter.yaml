# Official chart from prometheus-community.github.io, values from this repository.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: node-exporter
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus-node-exporter
      targetRevision: 4.59.0
      helm:
        releaseName: node-exporter
        valueFiles:
          - $values/k8s/node-exporter/values.yaml
    - repoURL: https://gitlab.com/WhiteMuush/gitlab-runner-on-azure.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
