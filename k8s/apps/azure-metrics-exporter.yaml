# Official chart from webdevops.github.io, values from this repository.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: azure-metrics-exporter
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://webdevops.github.io/helm-charts
      chart: azure-metrics-exporter
      targetRevision: 1.2.11
      helm:
        releaseName: azure-metrics-exporter
        valueFiles:
          - $values/k8s/azure-metrics-exporter/values.yaml
    - repoURL: https://gitlab.com/WhiteMuush/gitlab-runner-on-azure.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: azure-metrics
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Terraform creates this namespace.
      - CreateNamespace=false
