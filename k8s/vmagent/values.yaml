# One vmagent per node reads every component except the runners.

mode: daemonSet

remoteWrite:
  - url: http://vm-victoria-metrics-cluster-vminsert.monitoring.svc.cluster.local:8480/insert/0/prometheus/api/v1/write

# Name of the node this agent runs on, used below to read only the pods of that node.
env:
  - name: NODE_NAME
    valueFrom:
      fieldRef:
        fieldPath: spec.nodeName

# The agents read themselves too, like any other pod.
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8429"

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi

config:
  global:
    scrape_interval: 15s
  scrape_configs:
    - job_name: pods
      kubernetes_sd_configs:
        - role: pod
          # Only read the pods of this agent's node.
          selectors:
            - role: pod
              field: spec.nodeName=%{NODE_NAME}
      relabel_configs:
        # Skip the runners, their sidecar already reads them.
        - source_labels: [__meta_kubernetes_namespace]
          regex: gitlab-runner
          action: drop
        # Keep only the pods that ask to be read.
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
          regex: "true"
          action: keep
        # Keep only the container port named in the annotation, to avoid duplicate targets.
        - source_labels: [__meta_kubernetes_pod_container_port_number, __meta_kubernetes_pod_annotation_prometheus_io_port]
          action: keep_if_equal
        # Read the port given by the prometheus.io/port annotation.
        - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
          regex: ([^:]+)(?::\d+)?;(\d+)
          replacement: $1:$2
          target_label: __address__
        # Read another path than /metrics when prometheus.io/path says so.
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
          regex: (.+)
          target_label: __metrics_path__
        # Labels to tell the series apart in Grafana.
        - source_labels: [__meta_kubernetes_namespace]
          target_label: namespace
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
        - source_labels: [__meta_kubernetes_pod_node_name]
          target_label: node
        - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
          regex: (.+)
          target_label: job

    # Kubelet metrics of this node.
    - job_name: kubelet
      scheme: https
      # Check the kubelet certificate.
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      kubernetes_sd_configs:
        - role: node
          # Only read the node this agent runs on.
          selectors:
            - role: node
              field: metadata.name=%{NODE_NAME}
      relabel_configs:
        - source_labels: [__meta_kubernetes_node_name]
          target_label: node

    # CPU and memory used by each container.
    - job_name: cadvisor
      scheme: https
      metrics_path: /metrics/cadvisor
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      kubernetes_sd_configs:
        - role: node
          selectors:
            - role: node
              field: metadata.name=%{NODE_NAME}
      relabel_configs:
        - source_labels: [__meta_kubernetes_node_name]
          target_label: node

    # Azure metrics of the disks.
    - job_name: azure-disks
      scrape_interval: 5m
      scrape_timeout: 1m
      metrics_path: /probe/metrics/resourcegraph
      params:
        subscription: ["5e683e0f-b00c-48d6-9769-5aaf598de8f1"]
        resourceType: ["Microsoft.Compute/disks"]
        name: ["azure_disk"]
        metric:
          - Composite Disk Read Bytes/sec
          - Composite Disk Write Bytes/sec
          - Composite Disk Read Operations/sec
          - Composite Disk Write Operations/sec
        aggregation: ["average"]
        interval: ["PT5M"]
        timespan: ["PT5M"]
      kubernetes_sd_configs: &azure_exporter
        - role: pod
          namespaces:
            names: [azure-metrics]
          # Only one agent reads the exporter.
          selectors:
            - role: pod
              field: spec.nodeName=%{NODE_NAME}
      relabel_configs: &azure_exporter_port
        - source_labels: [__meta_kubernetes_pod_container_port_number]
          regex: "8080"
          action: keep

    # Availability, requests and latency of the backup storage account.
    - job_name: azure-storage
      scrape_interval: 5m
      scrape_timeout: 1m
      metrics_path: /probe/metrics/resourcegraph
      params:
        subscription: ["5e683e0f-b00c-48d6-9769-5aaf598de8f1"]
        resourceType: ["Microsoft.Storage/storageAccounts"]
        name: ["azure_storage"]
        metric: [Availability, Transactions, SuccessE2ELatency]
        aggregation: ["average", "total"]
        interval: ["PT5M"]
        timespan: ["PT5M"]
      kubernetes_sd_configs: *azure_exporter
      relabel_configs: *azure_exporter_port

    # Azure measures the used space once per hour.
    - job_name: azure-storage-capacity
      scrape_interval: 15m
      scrape_timeout: 1m
      metrics_path: /probe/metrics/resourcegraph
      params:
        subscription: ["5e683e0f-b00c-48d6-9769-5aaf598de8f1"]
        resourceType: ["Microsoft.Storage/storageAccounts"]
        name: ["azure_storage"]
        metric: [UsedCapacity]
        aggregation: ["average"]
        interval: ["PT1H"]
        timespan: ["PT1H"]
      kubernetes_sd_configs: *azure_exporter
      relabel_configs: *azure_exporter_port
