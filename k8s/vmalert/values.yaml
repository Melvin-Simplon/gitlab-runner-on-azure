# vmalert checks the alert rules, Alertmanager groups the alerts that fire.

server:
  # vmalert reads the metrics from vmselect.
  datasource:
    url: http://vm-victoria-metrics-cluster-vmselect.monitoring.svc.cluster.local:8481/select/0/prometheus
  # vmalert saves the alert states, so a restart does not forget them.
  remoteWrite:
    url: http://vm-victoria-metrics-cluster-vminsert.monitoring.svc.cluster.local:8480/insert/0/prometheus
  remoteRead:
    url: http://vm-victoria-metrics-cluster-vmselect.monitoring.svc.cluster.local:8481/select/0/prometheus
  notifier:
    alertmanager:
      url: http://vmalert-victoria-metrics-alert-alertmanager.monitoring.svc.cluster.local:9093

  # Metrics read by the vmagent DaemonSet.
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8880"

  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi

alertmanager:
  enabled: true

  # Metrics read by the vmagent DaemonSet.
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9093"

  # No notification for now, the alerts are read in Grafana.
  config:
    route:
      receiver: grafana-only
      group_by: [alertname, namespace]
    receivers:
      - name: grafana-only
    # An alert that explains others hides them, so one problem shows once.
    inhibit_rules:
      # A node that is down explains the warnings of that node.
      - source_matchers: [alertname="NodeNotReady"]
        target_matchers: [severity="warning"]
        equal: [node]
      # A certificate that is not ready explains why it may expire.
      - source_matchers: [alertname="CertificateNotReady"]
        target_matchers: [alertname="CertificateExpiresSoon"]
        equal: [exported_namespace, name]
      # A failed backup explains why the last good one is old.
      - source_matchers: [alertname="VeleroBackupFailed"]
        target_matchers: [alertname="VeleroBackupTooOld"]
        equal: [schedule]
      # Azure storage that is down explains the Velero alerts.
      - source_matchers: [alertname="AzureStorageUnavailable"]
        target_matchers: [alertname=~"VeleroBackupFailed|VeleroBackupTooOld"]

  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
