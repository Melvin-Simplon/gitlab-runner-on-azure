# Alert rules checked by vmalert every minute.

server:
  config:
    alerts:
      groups:
        # The machines of the cluster.
        - name: nodes
          rules:
            # Kubernetes cannot use this node anymore.
            - alert: NodeNotReady
              # The question vmalert asks to the metrics.
              expr: kube_node_status_condition{condition="Ready",status="true"} == 0
              # How long the problem must last before the alert fires.
              for: 5m
              labels:
                # Critical means something is down, warning means something is at risk.
                severity: critical
              annotations:
                # The sentence shown in Grafana.
                summary: "Node {{ $labels.node }} is not ready."

            # A full disk stops the pods of this node.
            - alert: NodeDiskAlmostFull
              expr: |
                node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
                  / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} < 0.10
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "Disk {{ $labels.mountpoint }} of {{ $labels.node }} has less than 10% free."

            # Without memory, Kubernetes starts killing pods.
            - alert: NodeMemoryLow
              expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "Node {{ $labels.node }} has less than 10% free memory."

        # The pods and their volumes.
        - name: workloads
          rules:
            # The pod starts, crashes, and starts again.
            - alert: PodCrashLooping
              expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} restarts again and again."

            # The pod is stuck before it can run.
            - alert: PodNotRunning
              expr: sum by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown|Failed"}) > 0
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has not been running for 15 minutes."

            # Some pods of the deployment are not ready.
            - alert: DeploymentReplicasMissing
              expr: kube_deployment_spec_replicas != kube_deployment_status_replicas_available
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} is missing pods."

            # A full volume stops the app that writes on it.
            - alert: VolumeAlmostFull
              expr: kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.15
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "Volume {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has less than 15% free."

        # The tools that run the cluster: vmagent, ArgoCD, cert-manager.
        - name: platform
          rules:
            # A component stopped sending its metrics.
            - alert: TargetDown
              expr: up == 0
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "vmagent cannot read the metrics of {{ $labels.job }} on {{ $labels.instance }}."

            # The cluster no longer matches Git.
            - alert: ArgoAppNotSynced
              expr: argocd_app_info{sync_status!="Synced"} == 1
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: "ArgoCD app {{ $labels.name }} differs from Git."

            # An app deployed by ArgoCD is broken.
            - alert: ArgoAppNotHealthy
              expr: argocd_app_info{health_status!="Healthy"} == 1
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: "ArgoCD app {{ $labels.name }} is {{ $labels.health_status }}."

            # Grafana loses HTTPS without this certificate.
            - alert: CertificateNotReady
              expr: certmanager_certificate_ready_status{condition="False"} == 1
              for: 10m
              labels:
                severity: critical
              annotations:
                summary: "Certificate {{ $labels.exported_namespace }}/{{ $labels.name }} is not ready."

            # cert-manager should renew it 30 days before the end.
            - alert: CertificateExpiresSoon
              expr: certmanager_certificate_expiration_timestamp_seconds - time() < 14 * 86400
              labels:
                severity: warning
              annotations:
                summary: "Certificate {{ $labels.exported_namespace }}/{{ $labels.name }} expires in less than 14 days."

        # The Velero backups and their Azure storage.
        - name: backups
          rules:
            # The last backups could not be saved.
            - alert: VeleroBackupFailed
              expr: increase(velero_backup_failure_total[6h]) > 0
              labels:
                severity: critical
              annotations:
                summary: "A Velero backup failed in the last 6 hours."

            # A backup is expected every 6 hours.
            - alert: VeleroBackupTooOld
              expr: time() - velero_backup_last_successful_timestamp{schedule!=""} > 7 * 3600
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: "Schedule {{ $labels.schedule }} has no successful backup for 7 hours."

            # Velero cannot save backups if Azure storage is down.
            - alert: AzureStorageUnavailable
              expr: azure_storage_availability_average_percent < 99
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: "The backup storage account is less than 99% available."

        # SLO error ratios of the runner, see docs/slo.md.
        - name: slo-runner-sli
          interval: 1m
          rules:
            # 1 when the runner answers, 0 when it does not or has no data while the cluster runs.
            - record: slo:runner_up:max
              expr: max(up{job="gitlab-runner"}) or vector(0)

            # Share of minutes where the runner did not answer.
            - record: slo:sli_error:ratio_rate5m
              expr: |
                1 - avg_over_time(slo:runner_up:max[5m])
              labels:
                slo: runner-reachable
            - record: slo:sli_error:ratio_rate30m
              expr: |
                1 - avg_over_time(slo:runner_up:max[30m])
              labels:
                slo: runner-reachable
            - record: slo:sli_error:ratio_rate1h
              expr: |
                1 - avg_over_time(slo:runner_up:max[1h])
              labels:
                slo: runner-reachable
            - record: slo:sli_error:ratio_rate6h
              expr: |
                1 - avg_over_time(slo:runner_up:max[6h])
              labels:
                slo: runner-reachable
            - record: slo:sli_error:ratio_rate1d
              expr: |
                1 - avg_over_time(slo:runner_up:max[1d])
              labels:
                slo: runner-reachable
            - record: slo:sli_error:ratio_rate3d
              expr: |
                1 - avg_over_time(slo:runner_up:max[3d])
              labels:
                slo: runner-reachable
            - record: slo:sli_error:ratio_rate30d
              expr: |
                1 - avg_over_time(slo:runner_up:max[30d])
              labels:
                slo: runner-reachable

            # Share of runner calls to the GitLab API that got a 5xx error.
            - record: slo:sli_error:ratio_rate5m
              expr: |
                (sum(increase(gitlab_runner_api_request_statuses_total{status=~"5.."}[5m])) or vector(0))
                  / sum(increase(gitlab_runner_api_request_statuses_total[5m]))
              labels:
                slo: runner-api
            - record: slo:sli_error:ratio_rate30m
              expr: |
                (sum(increase(gitlab_runner_api_request_statuses_total{status=~"5.."}[30m])) or vector(0))
                  / sum(increase(gitlab_runner_api_request_statuses_total[30m]))
              labels:
                slo: runner-api
            - record: slo:sli_error:ratio_rate1h
              expr: |
                (sum(increase(gitlab_runner_api_request_statuses_total{status=~"5.."}[1h])) or vector(0))
                  / sum(increase(gitlab_runner_api_request_statuses_total[1h]))
              labels:
                slo: runner-api
            - record: slo:sli_error:ratio_rate6h
              expr: |
                (sum(increase(gitlab_runner_api_request_statuses_total{status=~"5.."}[6h])) or vector(0))
                  / sum(increase(gitlab_runner_api_request_statuses_total[6h]))
              labels:
                slo: runner-api
            - record: slo:sli_error:ratio_rate1d
              expr: |
                (sum(increase(gitlab_runner_api_request_statuses_total{status=~"5.."}[1d])) or vector(0))
                  / sum(increase(gitlab_runner_api_request_statuses_total[1d]))
              labels:
                slo: runner-api
            - record: slo:sli_error:ratio_rate3d
              expr: |
                (sum(increase(gitlab_runner_api_request_statuses_total{status=~"5.."}[3d])) or vector(0))
                  / sum(increase(gitlab_runner_api_request_statuses_total[3d]))
              labels:
                slo: runner-api
            - record: slo:sli_error:ratio_rate30d
              expr: |
                (sum(increase(gitlab_runner_api_request_statuses_total{status=~"5.."}[30d])) or vector(0))
                  / sum(increase(gitlab_runner_api_request_statuses_total[30d]))
              labels:
                slo: runner-api

            # Share of jobs that failed because of the runner.
            - record: slo:sli_error:ratio_rate5m
              expr: |
                (sum(increase(gitlab_runner_failed_jobs_total{failure_reason!~"script_failure|job_canceled"}[5m])) or vector(0))
                  / sum(increase(gitlab_runner_jobs_total[5m]))
              labels:
                slo: runner-jobs-success
            - record: slo:sli_error:ratio_rate30m
              expr: |
                (sum(increase(gitlab_runner_failed_jobs_total{failure_reason!~"script_failure|job_canceled"}[30m])) or vector(0))
                  / sum(increase(gitlab_runner_jobs_total[30m]))
              labels:
                slo: runner-jobs-success
            - record: slo:sli_error:ratio_rate1h
              expr: |
                (sum(increase(gitlab_runner_failed_jobs_total{failure_reason!~"script_failure|job_canceled"}[1h])) or vector(0))
                  / sum(increase(gitlab_runner_jobs_total[1h]))
              labels:
                slo: runner-jobs-success
            - record: slo:sli_error:ratio_rate6h
              expr: |
                (sum(increase(gitlab_runner_failed_jobs_total{failure_reason!~"script_failure|job_canceled"}[6h])) or vector(0))
                  / sum(increase(gitlab_runner_jobs_total[6h]))
              labels:
                slo: runner-jobs-success
            - record: slo:sli_error:ratio_rate1d
              expr: |
                (sum(increase(gitlab_runner_failed_jobs_total{failure_reason!~"script_failure|job_canceled"}[1d])) or vector(0))
                  / sum(increase(gitlab_runner_jobs_total[1d]))
              labels:
                slo: runner-jobs-success
            - record: slo:sli_error:ratio_rate3d
              expr: |
                (sum(increase(gitlab_runner_failed_jobs_total{failure_reason!~"script_failure|job_canceled"}[3d])) or vector(0))
                  / sum(increase(gitlab_runner_jobs_total[3d]))
              labels:
                slo: runner-jobs-success
            - record: slo:sli_error:ratio_rate30d
              expr: |
                (sum(increase(gitlab_runner_failed_jobs_total{failure_reason!~"script_failure|job_canceled"}[30d])) or vector(0))
                  / sum(increase(gitlab_runner_jobs_total[30d]))
              labels:
                slo: runner-jobs-success

            # Share of jobs that waited more than 60 seconds before a runner took them.
            - record: slo:sli_error:ratio_rate5m
              expr: |
                1 - sum(increase(gitlab_runner_job_queue_duration_seconds_bucket{le="60"}[5m]))
                  / sum(increase(gitlab_runner_job_queue_duration_seconds_count[5m]))
              labels:
                slo: runner-jobs-start
            - record: slo:sli_error:ratio_rate30m
              expr: |
                1 - sum(increase(gitlab_runner_job_queue_duration_seconds_bucket{le="60"}[30m]))
                  / sum(increase(gitlab_runner_job_queue_duration_seconds_count[30m]))
              labels:
                slo: runner-jobs-start
            - record: slo:sli_error:ratio_rate1h
              expr: |
                1 - sum(increase(gitlab_runner_job_queue_duration_seconds_bucket{le="60"}[1h]))
                  / sum(increase(gitlab_runner_job_queue_duration_seconds_count[1h]))
              labels:
                slo: runner-jobs-start
            - record: slo:sli_error:ratio_rate6h
              expr: |
                1 - sum(increase(gitlab_runner_job_queue_duration_seconds_bucket{le="60"}[6h]))
                  / sum(increase(gitlab_runner_job_queue_duration_seconds_count[6h]))
              labels:
                slo: runner-jobs-start
            - record: slo:sli_error:ratio_rate1d
              expr: |
                1 - sum(increase(gitlab_runner_job_queue_duration_seconds_bucket{le="60"}[1d]))
                  / sum(increase(gitlab_runner_job_queue_duration_seconds_count[1d]))
              labels:
                slo: runner-jobs-start
            - record: slo:sli_error:ratio_rate3d
              expr: |
                1 - sum(increase(gitlab_runner_job_queue_duration_seconds_bucket{le="60"}[3d]))
                  / sum(increase(gitlab_runner_job_queue_duration_seconds_count[3d]))
              labels:
                slo: runner-jobs-start
            - record: slo:sli_error:ratio_rate30d
              expr: |
                1 - sum(increase(gitlab_runner_job_queue_duration_seconds_bucket{le="60"}[30d]))
                  / sum(increase(gitlab_runner_job_queue_duration_seconds_count[30d]))
              labels:
                slo: runner-jobs-start

        # Alerts that fire when an SLO error budget goes too fast, see docs/slo.md.
        - name: slo-runner-alerts
          rules:
            # The runner-reachable budget will be gone within days.
            - alert: RunnerReachableBudgetBurnFast
              expr: |
                (
                  slo:sli_error:ratio_rate1h{slo="runner-reachable"} > 0.144
                  and
                  slo:sli_error:ratio_rate5m{slo="runner-reachable"} > 0.144
                )
                or
                (
                  slo:sli_error:ratio_rate6h{slo="runner-reachable"} > 0.06
                  and
                  slo:sli_error:ratio_rate30m{slo="runner-reachable"} > 0.06
                )
              for: 2m
              labels:
                severity: critical
                slo: runner-reachable
              annotations:
                summary: "SLO runner-reachable: the runner does not answer, the error budget burns too fast."
            # The runner-reachable budget will be gone before the end of the 30 days.
            - alert: RunnerReachableBudgetBurnSlow
              expr: |
                (
                  slo:sli_error:ratio_rate3d{slo="runner-reachable"} > 0.01
                  and
                  slo:sli_error:ratio_rate6h{slo="runner-reachable"} > 0.01
                )
              for: 15m
              labels:
                severity: warning
                slo: runner-reachable
              annotations:
                summary: "SLO runner-reachable: the runner does not answer, the error budget burns too fast."
            # The runner-api budget will be gone within days.
            - alert: RunnerApiBudgetBurnFast
              expr: |
                (
                  slo:sli_error:ratio_rate1h{slo="runner-api"} > 0.144
                  and
                  slo:sli_error:ratio_rate5m{slo="runner-api"} > 0.144
                )
                or
                (
                  slo:sli_error:ratio_rate6h{slo="runner-api"} > 0.06
                  and
                  slo:sli_error:ratio_rate30m{slo="runner-api"} > 0.06
                )
              for: 2m
              labels:
                severity: critical
                slo: runner-api
              annotations:
                summary: "SLO runner-api: the runner gets 5xx errors from GitLab, the error budget burns too fast."
            # The runner-api budget will be gone before the end of the 30 days.
            - alert: RunnerApiBudgetBurnSlow
              expr: |
                (
                  slo:sli_error:ratio_rate3d{slo="runner-api"} > 0.01
                  and
                  slo:sli_error:ratio_rate6h{slo="runner-api"} > 0.01
                )
              for: 15m
              labels:
                severity: warning
                slo: runner-api
              annotations:
                summary: "SLO runner-api: the runner gets 5xx errors from GitLab, the error budget burns too fast."
            # The runner-jobs-success budget will be gone within days.
            - alert: RunnerJobsFailBudgetBurnFast
              expr: |
                (
                  slo:sli_error:ratio_rate6h{slo="runner-jobs-success"} > 0.06
                  and
                  slo:sli_error:ratio_rate1h{slo="runner-jobs-success"} > 0.06
                )
              for: 2m
              labels:
                severity: critical
                slo: runner-jobs-success
              annotations:
                summary: "SLO runner-jobs-success: jobs fail because of the runner, the error budget burns too fast."
            # The runner-jobs-success budget will be gone before the end of the 30 days.
            - alert: RunnerJobsFailBudgetBurnSlow
              expr: |
                (
                  slo:sli_error:ratio_rate3d{slo="runner-jobs-success"} > 0.01
                  and
                  slo:sli_error:ratio_rate6h{slo="runner-jobs-success"} > 0.01
                )
              for: 15m
              labels:
                severity: warning
                slo: runner-jobs-success
              annotations:
                summary: "SLO runner-jobs-success: jobs fail because of the runner, the error budget burns too fast."
            # The runner-jobs-start budget will be gone within days.
            - alert: RunnerJobsSlowBudgetBurnFast
              expr: |
                (
                  slo:sli_error:ratio_rate6h{slo="runner-jobs-start"} > 0.3
                  and
                  slo:sli_error:ratio_rate1h{slo="runner-jobs-start"} > 0.3
                )
              for: 2m
              labels:
                severity: critical
                slo: runner-jobs-start
              annotations:
                summary: "SLO runner-jobs-start: jobs wait more than 60 seconds to start, the error budget burns too fast."
            # The runner-jobs-start budget will be gone before the end of the 30 days.
            - alert: RunnerJobsSlowBudgetBurnSlow
              expr: |
                (
                  slo:sli_error:ratio_rate3d{slo="runner-jobs-start"} > 0.05
                  and
                  slo:sli_error:ratio_rate6h{slo="runner-jobs-start"} > 0.05
                )
              for: 15m
              labels:
                severity: warning
                slo: runner-jobs-start
              annotations:
                summary: "SLO runner-jobs-start: jobs wait more than 60 seconds to start, the error budget burns too fast."
