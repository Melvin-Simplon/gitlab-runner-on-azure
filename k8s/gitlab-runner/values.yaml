# gitlab-runner chart values, jobs run as pods in this namespace.
gitlabUrl: https://gitlab.com/

# Two jobs at a time, because the cluster only has 4 vCPU.
concurrent: 2

# Lets the runner create job pods, secrets and configmaps in its namespace.
rbac:
  create: true

# Prometheus-format metrics, read by the vmagent sidecar (vmagent-sidecar.yaml).
metrics:
  # Uh uh
  enabled: true
  # The runner listens on this port and the sidecar reads it.
  port: 9252
service:
  enabled: true

runners:
  # Secret created by make runner-secret, so the token never goes to Git.
  secret: gitlab-runner-token
  config: |
    [[runners]]
      [runners.kubernetes]
        namespace = "{{.Release.Namespace}}"
        image = "alpine:3.22"
        cpu_request = "250m"
        cpu_limit = "1"
        memory_request = "256Mi"
        memory_limit = "1Gi"
        helper_cpu_request = "50m"
        helper_memory_request = "64Mi"
