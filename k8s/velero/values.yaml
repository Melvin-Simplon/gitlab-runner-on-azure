# Velero saves the cluster resources into Azure.

# Adds the Azure plugin to Velero.
initContainers:
  - name: velero-plugin-for-microsoft-azure
    image: velero/velero-plugin-for-microsoft-azure:v1.14.4
    volumeMounts:
      - mountPath: /target
        name: plugins

# This label gives the pod its Azure identity.
podLabels:
  azure.workload.identity/use: "true"

# Terraform creates the service account and the Secret.
serviceAccount:
  server:
    create: false
    name: velero
credentials:
  useSecret: true
  existingSecret: velero-azure

configuration:
  backupStorageLocation:
    - name: default
      provider: azure
      bucket: velero
      default: true
      config:
        resourceGroup: mpetitRG
        storageAccount: stmpetitvelero
        # Log in with the Azure identity, not with a key.
        useAAD: "true"

# Save the Kubernetes resources, not the disk contents.
snapshotsEnabled: false
deployNodeAgent: false

# ArgoCD already applies the CRDs of the chart.
upgradeCRDs: false

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

# A full backup every 6 hours, kept for 7 days.
schedules:
  every-6h:
    schedule: "0 */6 * * *"
    template:
      ttl: 168h
      storageLocation: default
      snapshotVolumes: false
