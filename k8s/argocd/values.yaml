# argo-cd chart values. UI reached through port-forward until the ingress lands (phase 2).
dex:
  enabled: false

configs:
  params:
    server.insecure: false
  cm:
    # Checks Git every 30s
    timeout.reconciliation: 30s
    timeout.reconciliation.jitter: 0s

# Metrics read by the vmagent DaemonSet: each pod says "read me" on its own metrics port.
controller:
  metrics:
    enabled: true
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8082"
server:
  metrics:
    enabled: true
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8083"
repoServer:
  metrics:
    enabled: true
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8084"
applicationSet:
  metrics:
    enabled: true
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
