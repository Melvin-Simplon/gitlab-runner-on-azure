# argo-cd chart values, the UI opens with make argocd-ui.
dex:
  enabled: false

configs:
  params:
    server.insecure: false
  cm:
    # Checks Git every 30s
    timeout.reconciliation: 30s
    timeout.reconciliation.jitter: 0s

# Each pod gives its metrics port to the vmagent DaemonSet.
controller:
  metrics:
    enabled: true
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8082"
server:
  metrics:
    enabled: true
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8083"
repoServer:
  metrics:
    enabled: true
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8084"
applicationSet:
  metrics:
    enabled: true
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
