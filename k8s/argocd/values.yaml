# argo-cd chart values. UI reached through port-forward until the ingress lands (phase 2).
dex:
  enabled: false

configs:
  params:
    server.insecure: false
  cm:
    # Checks Git every 30s
    timeout.reconciliation: 30s
    timeout.reconciliation.jitter: 0s

# Metrics exposed now, scraped once the Prometheus agents exist (phase 3).
controller:
  metrics:
    enabled: true
server:
  metrics:
    enabled: true
repoServer:
  metrics:
    enabled: true
applicationSet:
  metrics:
    enabled: true
