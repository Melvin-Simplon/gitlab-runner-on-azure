# Let's Encrypt issuer, loaded after values.yaml.

extraObjects:
  - |
    apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    metadata:
      name: letsencrypt
    spec:
      acme:
        server: https://acme-v02.api.letsencrypt.org/directory
        # Private key of our Let's Encrypt account, created and kept by cert-manager.
        privateKeySecretRef:
          name: letsencrypt-account-key
        solvers:
          # Let's Encrypt checks a token on port 80, served by Traefik.
          - http01:
              ingress:
                ingressClassName: traefik
